              <backup_log><database>system</database><table>backup_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></backup_log>
            </clickhouse>
            EOF
            # Map PostHog's compose-era hostnames to localhost so CH can resolve objectstorage
            # (data warehouse tests query S3 URLs that ref the hostname, not 'localhost')
            # host.docker.internal: PostHog's data warehouse tests use this Docker-Desktop magic
            # hostname for S3 endpoints. On Linux Docker / CCI it's not auto-resolved.
            echo "127.0.0.1 objectstorage db redis7 kafka clickhouse clickhouse-coordinator seaweedfs temporal minio host.docker.internal" >> /etc/hosts
            # Enable non-deterministic mutations for ALTER UPDATE/DELETE with dictGet/subquery —
            # PostHog's test_delete_person + test_backfill_*_on_events use these and CH blocks
            # them by default on Replicated tables.
            mkdir -p /etc/clickhouse-server/users.d
            cat > /etc/clickhouse-server/users.d/posthog-overrides.xml \<<'UEOF'
            <clickhouse>
              <profiles>
                <default>
                  <allow_nondeterministic_mutations>1</allow_nondeterministic_mutations>
                  <mutations_sync>1</mutations_sync>
                </default>
              </profiles>
            </clickhouse>
            UEOF
            exec /entrypoint.sh
      - image: zookeeper:3.7.0
      - image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        command:
          - redpanda
          - start
          - --kafka-addr=internal://0.0.0.0:9092
          - --advertise-kafka-addr=internal://localhost:9092
          - --rpc-addr=0.0.0.0:33145
          - --advertise-rpc-addr=localhost:33145
          - --mode=dev-container
          - --smp=1
          - --memory=1G
          - --overprovisioned
          - --set
          - redpanda.empty_seed_starts_cluster=true
      - image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        environment:
          MINIO_ROOT_USER: object_storage_root_user
          MINIO_ROOT_PASSWORD: object_storage_root_password
        entrypoint: sh
        command: ["-c", "mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address :19000 --console-address :19001 /data"]
      - image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
        environment:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      - image: temporalio/auto-setup:1.22
        environment:
          DB: postgres12
          DB_PORT: "5432"
          POSTGRES_USER: posthog
          POSTGRES_PWD: posthog
          POSTGRES_SEEDS: localhost
          DBNAME: temporal
          VISIBILITY_DBNAME: temporal_visibility
          LOG_LEVEL: warn
    resource_class: large.gen2
    environment:
      SECRET_KEY: "6b01eee4f945ca25045b5aab440b953461faf08693a9abbf1166dc7c6b9772da"
      DATABASE_URL: "postgres://posthog:posthog@localhost:5432/posthog"
      REDIS_URL: "redis://localhost"
      CLICKHOUSE_HOST: "localhost"
      CLICKHOUSE_SECURE: "False"
      CLICKHOUSE_VERIFY: "False"
      TEST: "1"
      OBJECT_STORAGE_ENABLED: "True"
      OBJECT_STORAGE_ENDPOINT: "http://localhost:19000"
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      GITHUB_ACTIONS: "true"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_AI_EVALS_<< parameters.group >>=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Skipped (sidecars on docker executor handle services)
          command: echo "Services running as docker sidecars; no compose up needed"
      - run:
          name: Add service hostnames
          command: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal host.docker.internal minio" | sudo tee -a /etc/hosts
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.10.2/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Python 3.12
          command: uv python install 3.12
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Wait for Docker services
          no_output_timeout: 15m
          command: |
            echo "Waiting for Postgres..."
            for i in $(seq 1 120); do
              if nc -z localhost 5432 2>/dev/null; then echo "Postgres ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; true; fi
              sleep 5
            done
            nc -z localhost 5432 || (echo "Postgres failed to start"; exit 1)
            echo "Waiting for ClickHouse..."
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8123/ping 2>/dev/null; then echo "ClickHouse ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; fi
              sleep 5
            done
            curl -sf http://localhost:8123/ping || (echo "ClickHouse failed"; exit 1)
            echo "Waiting for Temporal..."
            for i in $(seq 1 60); do
              if nc -z localhost 7233 2>/dev/null; then echo "Temporal ready after ${i}x5s"; break; fi
              if [ $((i % 12)) -eq 0 ]; then echo "Still waiting for Temporal ($i/60)..."; fi
              sleep 5
            done
            nc -z localhost 7233 || echo "Temporal not ready (continuing anyway, some tests may fail)"
      - run:
          name: Push PostHog UDFs to ClickHouse
          command: |
            python3 - \<<'PYEOF' 2>&1 || echo "(UDF push non-fatal)"
            import xml.etree.ElementTree as ET, re, urllib.request, sys, os
            if not os.path.exists('docker/clickhouse/user_defined_function.xml'):
                print('No UDF file; skipping'); sys.exit(0)
            base = open('docker/clickhouse/user_defined_function.xml').read()
            try:
                latest = open('posthog/user_scripts/latest_user_defined_function.xml').read()
                funcs = re.findall(r'<function>.*?</function>', latest, re.DOTALL)
                merged = base.rsplit('</functions>', 1)[0] + '\n' + '\n'.join(funcs) + '\n</functions>\n'
            except FileNotFoundError:
                merged = base
            root = ET.fromstring(merged)
            pushed = skipped = 0
            for fn in root.findall('.//function'):
                ftype = (fn.findtext('type') or 'sql').lower()
                name = fn.findtext('name')
                body = fn.findtext('lambda') or fn.findtext('command')
                if ftype != 'executable_pool' and ftype != 'executable' and name and body:
                    stmt = f"CREATE OR REPLACE FUNCTION {name} AS {body}"
                    try:
                        urllib.request.urlopen(
                            urllib.request.Request('http://localhost:8123/', data=stmt.encode(), method='POST'),
                            timeout=10
                        ).read()
                        pushed += 1
                    except Exception as e:
                        print(f'WARN: UDF {name} push failed: {e}', file=sys.stderr)
                else:
                    skipped += 1
            # Pre-create system.crash_log + trigger lazy creation of other system log tables.
            try:
                ddl = ("CREATE TABLE IF NOT EXISTS system.crash_log ("
                       "hostname LowCardinality(String), event_date Date, event_time DateTime, "
                       "timestamp_ns UInt64, signal Int32, thread_id UInt64, query_id String, "
                       "trace Array(UInt64), trace_full Array(String), version String, "
                       "revision UInt32, build_id String DEFAULT '') "
                       "ENGINE = MergeTree ORDER BY event_time")
                urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=ddl.encode(), method='POST'), timeout=10).read()
                for q in ['SELECT 1', 'SYSTEM FLUSH LOGS']:
                    try:
                        urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=q.encode(), method='POST'), timeout=10).read()
                    except: pass
                print('Pre-created system.crash_log + flushed lazy logs')
            except Exception as e:
                print(f'WARN: system table init: {e}', file=sys.stderr)
            print(f'UDFs: {pushed} pushed, {skipped} skipped (executable UDFs not supported on docker sidecar)')
            PYEOF
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run AI evals (<< parameters.group >>)
          command: EVAL_MODE=ci uv run pytest << parameters.test-paths >> -vv --junitxml=junit.xml || true
          no_output_timeout: 45m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # MCP UI APPS CI — Build and validate UI apps
  # ==========================================================================
  mcp-ui-apps:
    docker:
      - image: cimg/node:lts
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
