                <warpstream_calculated_events><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_calculated_events>
                <warpstream_replay><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_replay>
              </named_collections>
              <macros><shard>01</shard><replica>ch1</replica><hostClusterType>online</hostClusterType><hostClusterRole>data</hostClusterRole></macros>
              <uncompressed_cache_size>268435456</uncompressed_cache_size>
              <mark_cache_size>268435456</mark_cache_size>
              <max_server_memory_usage>1610612736</max_server_memory_usage>
              <max_server_memory_usage_to_ram_ratio>0.2</max_server_memory_usage_to_ram_ratio>
              <background_pool_size>2</background_pool_size>
              <max_thread_pool_size>200</max_thread_pool_size>
              <zookeeper>
                <node><host>localhost</host><port>2181</port></node>
              </zookeeper>
              <distributed_ddl><path>/clickhouse/task_queue/ddl</path></distributed_ddl>
