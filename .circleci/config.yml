        command: ["-c", "mkdir -p /data/posthog /data/ducklake-dev /data/ai-blobs && minio server --address :19000 --console-address :19001 /data"]
      - image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
        environment:
          discovery.type: single-node
          xpack.security.enabled: "false"
          ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      - image: temporalio/auto-setup:1.22
        environment:
          DB: postgres12
          DB_PORT: "5432"
          POSTGRES_USER: posthog
          POSTGRES_PWD: posthog
          POSTGRES_SEEDS: localhost
          DBNAME: temporal
          VISIBILITY_DBNAME: temporal_visibility
          LOG_LEVEL: warn
    resource_class: large.gen2
    environment:
      REDIS_URL: "redis://localhost"
      CLICKHOUSE_HOST: "localhost"
      CLICKHOUSE_DATABASE: "posthog_test"
      KAFKA_HOSTS: "kafka:9092"
      OBJECT_STORAGE_ENABLED: "true"
      OBJECT_STORAGE_ENDPOINT: "http://localhost:19000"
      OBJECT_STORAGE_ACCESS_KEY_ID: "object_storage_root_user"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "object_storage_root_password"
      GITHUB_ACTIONS: "true"
      SECRET_KEY: "abcdef"
      DATABASE_URL: "postgres://posthog:posthog@localhost:5432/test_posthog"
      PERSONS_DATABASE_URL: "postgres://posthog:posthog@localhost:5432/test_persons"
      PERSONS_READONLY_DATABASE_URL: "postgres://posthog:posthog@localhost:5432/test_persons"
      BEHAVIORAL_COHORTS_DATABASE_URL: "postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts"
      TEST: "1"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_NODEJS_TEST_<< parameters.shard >>=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Start Docker services (with localstack + maildev for KMS/email tests)
          command: |
            for attempt in 1 2 3; do
              COMPOSE_FILE=docker-compose.dev.yml:docker-compose.profiles.yml COMPOSE_PROFILES=temporal,azure,dev_tools,localstack docker compose up -d db redis7 clickhouse zookeeper kafka objectstorage temporal elasticsearch localstack maildev && break
              echo "Attempt $attempt failed, retrying in 10s..."
              sleep 10
            done
          no_output_timeout: 10m
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.10.2/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Python 3.12
          command: uv python install 3.12
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Configure cargo for HTTPS git fetch (cyclotron private deps)
          command: |
            git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
            git config --global url."https://github.com/".insteadOf "git@github.com:"
            mkdir -p $HOME/.cargo
            printf '[net]\ngit-fetch-with-cli = true\n' > $HOME/.cargo/config.toml
            echo 'export CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$BASH_ENV"
      - run:
          name: Install system deps
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libxml2-dev libxmlsec1-dev libxmlsec1-openssl unzip brotli || true
            curl -sSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip
            sudo unzip -o /tmp/protoc.zip -d /usr/local
            sudo chmod 755 /usr/local/bin/protoc
            protoc --version
      - run:
          name: Install pnpm + Node
          command: |
            # corepack ships with cimg/python:3.12-node; avoids EACCES on /usr/local/lib/node_modules
            # that hits when running `npm install -g pnpm` as non-root.
            mkdir -p "$HOME/.local/share/pnpm" "$HOME/.local/bin"
            export COREPACK_HOME="$HOME/.cache/corepack"
            corepack enable --install-directory "$HOME/.local/bin"
            corepack prepare pnpm@11.1.1 --activate
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - restore_cache:
          keys:
            - sqlx-cli-v0.8.3-{{ arch }}
      - run:
          name: Install sqlx-cli (used by setup:test:rust migrate-entry)
          command: |
            if [ ! -x "$HOME/.cargo/bin/sqlx" ]; then
              cargo install sqlx-cli --version 0.8.3 --no-default-features --features native-tls,postgres
            else
              echo "sqlx already installed: $($HOME/.cargo/bin/sqlx --version)"
            fi
      - save_cache:
          key: sqlx-cli-v0.8.3-{{ arch }}
          paths:
            - ~/.cargo/bin/sqlx
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev
      - run:
          name: Install Node dependencies
          command: pnpm --filter=@posthog/nodejs... install --frozen-lockfile
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Add service hostnames
          command: echo "127.0.0.1 db redis7 kafka clickhouse clickhouse-coordinator objectstorage seaweedfs temporal host.docker.internal minio" | sudo tee -a /etc/hosts
      - run:
          name: Wait for services
          no_output_timeout: 15m
          command: |
            echo "Waiting for Postgres..."
            for i in $(seq 1 120); do
              if nc -z localhost 5432 2>/dev/null; then echo "Postgres ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; true; fi
              sleep 5
            done
            nc -z localhost 5432 || (echo "Postgres failed to start"; exit 1)
            echo "Waiting for ClickHouse..."
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8123/ping 2>/dev/null; then echo "ClickHouse ready after ${i}x5s"; break; fi
              if [ $((i % 20)) -eq 0 ]; then echo "Still waiting ($i/120)..."; fi
              sleep 5
            done
            curl -sf http://localhost:8123/ping || (echo "ClickHouse failed"; exit 1)
            echo "Waiting for Temporal..."
            for i in $(seq 1 60); do
              if nc -z localhost 7233 2>/dev/null; then echo "Temporal ready after ${i}x5s"; break; fi
              if [ $((i % 12)) -eq 0 ]; then echo "Still waiting for Temporal ($i/60)..."; fi
              sleep 5
            done
            nc -z localhost 7233 || echo "Temporal not ready (continuing anyway, some tests may fail)"
      - run:
          name: Push PostHog UDFs to ClickHouse
          command: |
            python3 - \<<'PYEOF' 2>&1 || echo "(UDF push non-fatal)"
            import xml.etree.ElementTree as ET, re, urllib.request, sys, os
            if not os.path.exists('docker/clickhouse/user_defined_function.xml'):
                print('No UDF file; skipping'); sys.exit(0)
            base = open('docker/clickhouse/user_defined_function.xml').read()
            try:
                latest = open('posthog/user_scripts/latest_user_defined_function.xml').read()
                funcs = re.findall(r'<function>.*?</function>', latest, re.DOTALL)
                merged = base.rsplit('</functions>', 1)[0] + '\n' + '\n'.join(funcs) + '\n</functions>\n'
            except FileNotFoundError:
                merged = base
            root = ET.fromstring(merged)
            pushed = skipped = 0
            for fn in root.findall('.//function'):
                ftype = (fn.findtext('type') or 'sql').lower()
                name = fn.findtext('name')
                body = fn.findtext('lambda') or fn.findtext('command')
                if ftype != 'executable_pool' and ftype != 'executable' and name and body:
                    stmt = f"CREATE OR REPLACE FUNCTION {name} AS {body}"
                    try:
                        urllib.request.urlopen(
                            urllib.request.Request('http://localhost:8123/', data=stmt.encode(), method='POST'),
                            timeout=10
                        ).read()
                        pushed += 1
                    except Exception as e:
                        print(f'WARN: UDF {name} push failed: {e}', file=sys.stderr)
                else:
                    skipped += 1
            # Pre-create system.crash_log + trigger lazy creation of other system log tables.
            try:
                ddl = ("CREATE TABLE IF NOT EXISTS system.crash_log ("
                       "hostname LowCardinality(String), event_date Date, event_time DateTime, "
                       "timestamp_ns UInt64, signal Int32, thread_id UInt64, query_id String, "
                       "trace Array(UInt64), trace_full Array(String), version String, "
                       "revision UInt32, build_id String DEFAULT '') "
                       "ENGINE = MergeTree ORDER BY event_time")
                urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=ddl.encode(), method='POST'), timeout=10).read()
                for q in ['SELECT 1', 'SYSTEM FLUSH LOGS']:
                    try:
                        urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=q.encode(), method='POST'), timeout=10).read()
                    except: pass
                print('Pre-created system.crash_log + flushed lazy logs')
            except Exception as e:
                print(f'WARN: system table init: {e}', file=sys.stderr)
            print(f'UDFs: {pushed} pushed, {skipped} skipped (executable UDFs not supported on docker sidecar)')
            PYEOF
      - run:
          name: Download MaxMind DB
          command: ./bin/download-mmdb || true
      - run:
          name: Create test databases (test_behavioral_cohorts)
          command: |
            PGPASSWORD=posthog psql -h localhost -U posthog -d posthog -c "CREATE DATABASE test_behavioral_cohorts;" 2>&1 | grep -v "already exists" || true
      - run:
          name: Set up test databases (mirrors GHA pnpm setup:test slow path)
          environment:
            DATABASE_URL: "postgres://posthog:posthog@localhost:5432/posthog"
            BEHAVIORAL_COHORTS_DATABASE_URL: "postgres://posthog:posthog@localhost:5432/test_behavioral_cohorts"
            TEST: "true"
          command: |
            # pnpm setup:test invokes `python manage.py …` directly; activate the uv venv so it finds Django
            source .venv/bin/activate
            pnpm --filter=@posthog/nodejs setup:test
            cd nodejs && pnpm run setup:test:persons-parity
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run Node.js tests (shard << parameters.shard >>/9)
          command: |
            # Pipeline #95: `bin/turbo run build` hangs silently after cyclotron compile.
            # Likely @posthog/nodejs:build runs but produces no output. Bypass turbo
            # entirely — build only what we need, with explicit echo timestamps so we
            # can see WHERE it hangs if it does.
            source .venv/bin/activate
            export DATABASE_URL='postgres://posthog:posthog@localhost:5432/test_posthog'
            export NODE_OPTIONS='--max_old_space_size=4096'
            export SHARD_INDEX=<< parameters.shard >>
            export SHARD_COUNT=9
            export LOG_LEVEL=info
            export LOCALSTACK_ENABLED=1
            export CI=true

            echo "[$(date +%T)] STEP 1: Build cyclotron-node (cargo)"
            cd rust/cyclotron-node
            cargo build --release 2>&1 | tail -5
            echo "[$(date +%T)] STEP 2: cyclotron-node cargo build DONE; move .so"
            TARGET_DIR="${CARGO_TARGET_DIR:-../target}"
            cp "$TARGET_DIR/release/libcyclotron_node.so" index.node || cp "$TARGET_DIR/release/libcyclotron_node.dylib" index.node || (echo "FATAL: cyclotron .so not found"; ls -la "$TARGET_DIR/release/" | head -20; exit 1)
            echo "[$(date +%T)] STEP 3: cyclotron .so copied to index.node"
            pnpm exec tsc 2>&1 || (echo "FATAL: cyclotron tsc failed"; exit 1)
            echo "[$(date +%T)] STEP 4: cyclotron tsc DONE"

            cd /home/circleci/project/nodejs
            echo "[$(date +%T)] STEP 5: in nodejs directory; jest binary at:"
            ls -la node_modules/.bin/jest 2>&1 || ls -la ../node_modules/.bin/jest 2>&1 || echo "(jest binary not found in either location)"

            echo "[$(date +%T)] STEP 6: invoking jest directly (shard $SHARD_INDEX/$SHARD_COUNT)"
            pnpm exec jest --runInBand --forceExit \
              --shard=$SHARD_INDEX/$SHARD_COUNT \
              --testPathIgnorePatterns='postgres-parity' \
              --verbose \
              --testTimeout=120000 \
              --reporters=default
            echo "[$(date +%T)] STEP 7: jest exited with $?"
          no_output_timeout: 60m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # E2E PLAYWRIGHT — Full stack E2E tests (machine xlarge for 8 vCPU)
  # ==========================================================================
  e2e-playwright:
    # migrated to docker.large.gen2: sidecars replace docker-compose, PostHog web runs in primary.
    # Note: this is aggressive — 32GB→8GB RAM ceiling. Sidecars trimmed (CH caches, ZK heap,
    # Redpanda memory, dropped ES + maildev), Playwright --workers=1 (was 4), 1 ingestion worker
    # (was 6). Expect 1-2 OOM-tune iterations before green. If it never fits in 8GB, bump to
    # docker.xlarge.gen2 (cost arb erodes: ~$0.0288 vs machine.xlarge.gen2 ~$0.044).
    docker:
      - image: mcr.microsoft.com/playwright:v1.50.0-jammy
        environment:
          DEBIAN_FRONTEND: noninteractive
      - image: postgres:15.12-alpine
        environment:
          POSTGRES_USER: posthog
          POSTGRES_DB: posthog
          POSTGRES_PASSWORD: posthog
        entrypoint: sh
        command:
          - -c
          - |
            mkdir -p /docker-entrypoint-initdb.d
            cat > /docker-entrypoint-initdb.d/00-posthog.sql \<<'EOF'
            CREATE DATABASE test_posthog;
            CREATE DATABASE posthog_persons;
            CREATE DATABASE posthog_persons_e2e_test;
            CREATE DATABASE posthog_e2e_test;
            CREATE DATABASE test_behavioral_cohorts;
            CREATE DATABASE cyclotron;
            CREATE DATABASE cyclotron_node;
            CREATE DATABASE dagster_test;
            CREATE DATABASE temporal;
            CREATE DATABASE temporal_visibility;
            GRANT ALL PRIVILEGES ON DATABASE test_posthog TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE posthog_e2e_test TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE posthog_persons_e2e_test TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE temporal TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO posthog;
            EOF
            exec docker-entrypoint.sh postgres -c shared_buffers=128MB -c work_mem=4MB -c max_connections=100
      - image: redis:7.2-alpine
        command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
      - image: clickhouse/clickhouse-server:26.3.9.8
        environment:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
          KAFKA_HOSTS: "localhost:9092"
        entrypoint: sh
        command:
          - -c
          - |
            mkdir -p /etc/clickhouse-server/config.d
            cat > /etc/clickhouse-server/config.d/posthog-cluster.xml \<<'EOF'
            <clickhouse>
              <remote_servers replace="replace">
                <posthog><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog>
                <posthog_single_shard><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_single_shard>
                <posthog_migrations><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_migrations>
                <posthog_writable><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_writable>
