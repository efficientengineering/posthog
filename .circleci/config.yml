                <warpstream_replay><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_replay>
              </named_collections>
              <macros>
                <shard>01</shard>
                <replica>ch1</replica>
                <hostClusterType>online</hostClusterType>
                <hostClusterRole>data</hostClusterRole>
              </macros>
              <uncompressed_cache_size>268435456</uncompressed_cache_size>
              <mark_cache_size>268435456</mark_cache_size>
              <max_server_memory_usage>4294967296</max_server_memory_usage>
              <max_server_memory_usage_to_ram_ratio>0.5</max_server_memory_usage_to_ram_ratio>
