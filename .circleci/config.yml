              <trace_log><database>system</database><table>trace_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></trace_log>
              <metric_log><database>system</database><table>metric_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><collect_interval_milliseconds>1000</collect_interval_milliseconds></metric_log>
              <asynchronous_metric_log><database>system</database><table>asynchronous_metric_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></asynchronous_metric_log>
              <opentelemetry_span_log><database>system</database><table>opentelemetry_span_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><engine>engine MergeTree partition by toYYYYMM(finish_date) order by (finish_date, finish_time_us, trace_id)</engine></opentelemetry_span_log>
              <session_log><database>system</database><table>session_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></session_log>
              <query_views_log><database>system</database><table>query_views_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_views_log>
              <query_thread_log><database>system</database><table>query_thread_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_thread_log>
              <text_log><database>system</database><table>text_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><level>warning</level></text_log>
              <backup_log><database>system</database><table>backup_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></backup_log>
            </clickhouse>
            EOF
            # Map PostHog's compose-era hostnames to localhost so CH can resolve objectstorage
            # (data warehouse tests query S3 URLs that ref the hostname, not 'localhost')
            # host.docker.internal: PostHog's data warehouse tests use this Docker-Desktop magic
            # hostname for S3 endpoints. On Linux Docker / CCI it's not auto-resolved.
            echo "127.0.0.1 objectstorage db redis7 kafka clickhouse clickhouse-coordinator seaweedfs temporal minio host.docker.internal" >> /etc/hosts
