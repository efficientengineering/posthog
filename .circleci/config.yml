          command: echo "JOB_START_E2E_PLAYWRIGHT=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install Python toolchain (mcr.microsoft.com/playwright image ships node + browsers; need uv)
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
              python3.12 python3.12-venv python3.12-dev build-essential \
              libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl brotli \
              curl ca-certificates postgresql-client netcat-openbsd || true
            curl -LsSf https://astral.sh/uv/0.10.2/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install pnpm via corepack
          command: |
            mkdir -p "$HOME/.local/bin"
            corepack enable --install-directory "$HOME/.local/bin"
            corepack prepare pnpm@11.1.1 --activate
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - restore_cache:
          keys:
            - uv-e2e-{{ checksum "uv.lock" }}
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev
      - save_cache:
          key: uv-e2e-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Install Node dependencies
          command: |
            pnpm --filter=@posthog/playwright... install --frozen-lockfile
            bin/turbo --filter=@posthog/frontend prepare
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Set up needed files
          command: |
            mkdir -p frontend/dist
            touch frontend/dist/index.html frontend/dist/layout.html frontend/dist/exporter.html
            ./bin/download-mmdb || true
      - run:
          name: Wait for sidecar services
          no_output_timeout: 15m
          command: |
            echo "Waiting for Postgres..."
            for i in $(seq 1 120); do nc -z localhost 5432 2>/dev/null && break; sleep 5; done
            nc -z localhost 5432 || (echo "Postgres failed"; exit 1)
            echo "Waiting for ClickHouse..."
            for i in $(seq 1 120); do curl -sf http://localhost:8123/ping 2>/dev/null && break; sleep 5; done
            curl -sf http://localhost:8123/ping || (echo "ClickHouse failed"; exit 1)
            echo "Waiting for Temporal..."
            for i in $(seq 1 60); do nc -z localhost 7233 2>/dev/null && break; sleep 5; done
            nc -z localhost 7233 || echo "Temporal not ready (continuing)"
      - run:
          name: Push PostHog UDFs to ClickHouse
          command: |
            python3 - \<<'PYEOF' 2>&1 || echo "(UDF push non-fatal)"
            import xml.etree.ElementTree as ET, re, urllib.request, sys, os
            if not os.path.exists('docker/clickhouse/user_defined_function.xml'):
                print('No UDF file; skipping'); sys.exit(0)
            base = open('docker/clickhouse/user_defined_function.xml').read()
            try:
                latest = open('posthog/user_scripts/latest_user_defined_function.xml').read()
                funcs = re.findall(r'<function>.*?</function>', latest, re.DOTALL)
                merged = base.rsplit('</functions>', 1)[0] + '\n' + '\n'.join(funcs) + '\n</functions>\n'
            except FileNotFoundError:
                merged = base
            root = ET.fromstring(merged)
            pushed = skipped = 0
            for fn in root.findall('.//function'):
                ftype = (fn.findtext('type') or 'sql').lower()
                name = fn.findtext('name')
                body = fn.findtext('lambda') or fn.findtext('command')
                if ftype not in ('executable', 'executable_pool') and name and body:
                    stmt = f"CREATE OR REPLACE FUNCTION {name} AS {body}"
                    try:
                        urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=stmt.encode(), method='POST'), timeout=10).read()
                        pushed += 1
                    except Exception as e:
                        print(f'WARN: UDF {name}: {e}', file=sys.stderr)
                else:
                    skipped += 1
            # Pre-create system.crash_log + trigger lazy creation of other system log tables.
            # PostHog's migrations create MVs over these system tables, but CH creates them
            # lazily on first use. Dagster (and any job hitting migrate_clickhouse early) fails
            # with "Unknown table expression identifier 'system.crash_log'" without this.
            try:
                ddl = ("CREATE TABLE IF NOT EXISTS system.crash_log ("
                       "hostname LowCardinality(String), event_date Date, event_time DateTime, "
                       "timestamp_ns UInt64, signal Int32, thread_id UInt64, query_id String, "
                       "trace Array(UInt64), trace_full Array(String), version String, "
                       "revision UInt32, build_id String DEFAULT '') "
                       "ENGINE = MergeTree ORDER BY event_time")
                urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=ddl.encode(), method='POST'), timeout=10).read()
                for q in ['SELECT 1', 'SYSTEM FLUSH LOGS']:
                    try:
                        urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=q.encode(), method='POST'), timeout=10).read()
                    except: pass
                print('Pre-created system.crash_log + flushed lazy logs')
            except Exception as e:
                print(f'WARN: system table init: {e}', file=sys.stderr)
            print(f'UDFs: {pushed} pushed, {skipped} skipped')
            PYEOF
      - run:
          name: Build frontend
          command: |
            pnpm --filter=@posthog/frontend... install --frozen-lockfile
            pnpm --filter=@posthog/frontend build:products
            pnpm --filter=@posthog/frontend build
      - run:
          name: Collect static files
          command: |
            cp frontend/node_modules/@posthog/rrweb/dist/image-bitmap-data-url-worker-*.js.map frontend/dist/ || true
            uv run python manage.py collectstatic --noinput
      - run:
          name: Install sqlx-cli (for persons-db Rust migrations)
          command: |
            if [ ! -x "$HOME/.cargo/bin/sqlx" ]; then
              cargo install sqlx-cli --version 0.8.3 --no-default-features --features native-tls,postgres
            fi
      - run:
          name: Run migrations (DBs pre-created by Postgres sidecar init.sql)
          command: |
            uv run python manage.py migrate --noinput
            sqlx migrate run -D "$PERSONS_DB_WRITER_URL" --source rust/persons_migrations/ || true
            uv run python manage.py migrate_clickhouse 2>&1
            uv run python manage.py setup_dev
      - run:
          name: Start PostHog web, Celery worker, Temporal worker (single worker each — 8GB ceiling)
          no_output_timeout: 3m
          command: |
            source ./bin/celery-queues.env
            export CELERY_WORKER_QUEUES
            uv run python manage.py run_autoreload_celery --type=worker --concurrency=1 &> /tmp/celery.log &
            uv run python manage.py start_temporal_worker --task-queue analytics-platform-task-queue &> /tmp/temporal-worker.log &
            uv run python -m granian --interface asgi posthog.asgi:application --host 0.0.0.0 --port 8000 --workers 1 &> /tmp/server.log &
      - run:
          name: Wait for PostHog to be ready
          command: |
            if ! timeout 360 bash -c 'until curl -sf http://localhost:8000; do sleep 2; done'; then
              echo "=== PostHog server failed to start; dumping logs ==="
              echo "--- /tmp/server.log ---"; tail -200 /tmp/server.log 2>/dev/null || echo "(no server log)"
              echo "--- /tmp/celery.log ---"; tail -200 /tmp/celery.log 2>/dev/null || echo "(no celery log)"
              echo "--- /tmp/temporal-worker.log ---"; tail -200 /tmp/temporal-worker.log 2>/dev/null || echo "(no temporal-worker log)"
              free -m; ps aux --sort=-%mem | head -20
              exit 1
            fi
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run Playwright tests (workers=1 — was 4 on machine.xlarge.gen2's 32GB)
          command: pnpm --filter=@posthog/playwright exec playwright test --workers=1 --update-snapshots
          no_output_timeout: 45m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"
      - run:
          name: Dump logs on failure
          when: on_fail
          command: |
            echo "=== web.log ===" && tail -300 /tmp/server.log 2>/dev/null || true
            echo "=== celery.log ===" && tail -200 /tmp/celery.log 2>/dev/null || true
            echo "=== temporal-worker.log ===" && tail -200 /tmp/temporal-worker.log 2>/dev/null || true
            free -m; ps aux --sort=-%mem | head -30

  # ==========================================================================
  # STORYBOOK — Build + Visual regression (simplified: 4 shards)
  # ==========================================================================
  storybook-build:
    docker:
      - image: cimg/node:lts
    resource_class: xlarge.gen2
    environment:
      NODE_OPTIONS: "--max-old-space-size=12288"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_STORYBOOK_BUILD=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: pnpm --filter=@posthog/storybook... install --frozen-lockfile
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Build Storybook
          command: |
            bin/turbo --filter=@posthog/storybook prepare
            pnpm --filter=@posthog/storybook build --test
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"
      - persist_to_workspace:
          root: .
          paths:
            - common/storybook/dist

  storybook-visual-regression:
    parameters:
      shard:
        type: integer
      browser:
        type: string
        default: "chromium"
      total-shards:
        type: integer
        default: 16
    docker:
      - image: cimg/node:lts-browsers
    resource_class: xlarge.gen2  # bumped from large.gen2 (8 GB) — Terser webpack OOMed during minification
    environment:
      NODE_OPTIONS: "--max-old-space-size=16384"
      PNPM_HOME: "/home/circleci/.local/share/pnpm"
      OPT_OUT_CAPTURE: "1"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_STORYBOOK_VR_<< parameters.shard >>=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - attach_workspace:
          at: .
      - run:
          name: Install pnpm
          command: |
            sudo npm install -g pnpm || corepack enable
            pnpm setup || true
            echo 'export PNPM_HOME="/home/circleci/.local/share/pnpm"' >> "$BASH_ENV"
            echo 'export PATH="$PNPM_HOME:$PATH"' >> "$BASH_ENV"
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: |
            pnpm --filter=@posthog/storybook... install --frozen-lockfile
            # Use npm for global utilities — pnpm exits non-zero when PNPM_HOME isn't in root's PATH
            sudo npm install -g http-server wait-on
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Serve Storybook
          command: pnpm exec http-server common/storybook/dist --port 6006 --silent
          background: true
      - run:
          name: Wait for Storybook
          command: pnpm wait-on http://127.0.0.1:6006 --timeout 60
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run visual regression tests (<< parameters.browser >> shard << parameters.shard >>/<< parameters.total-shards >>)
          command: |
            cd common/storybook && pnpm exec test-storybook -u --no-index-json --maxWorkers=1 --browsers << parameters.browser >> --shard << parameters.shard >>/<< parameters.total-shards >> || true
          no_output_timeout: 30m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # CONTAINER IMAGES CI — Docker build + Hadolint
  # ==========================================================================
  container-image-build:
    # migrated from machine: uses docker executor + setup_remote_docker for the daemon.
    # Cost note: docker.large.gen2 primary ($0.0144/min) + remote daemon (~$0.022/min)
    # is *higher* per minute than machine.large.gen2 ($0.022/min). Migration done for
    # fleet uniformity in the benchmark; not a per-job cost win.
    docker:
      - image: cimg/base:current
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_CONTAINER_IMAGE_BUILD=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - setup_remote_docker:
          version: default
          docker_layer_caching: false
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Build Docker image
          command: docker build -t posthog-ci:test .
          no_output_timeout: 30m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  container-image-lint:
    docker:
      - image: cimg/base:current
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_CONTAINER_IMAGE_LINT=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Install Hadolint
          command: |
            wget -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
            chmod +x /tmp/hadolint
      - run:
          name: Lint Dockerfiles
          command: find . -name 'Dockerfile*' -not -path './node_modules/*' | xargs /tmp/hadolint || true
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # CLI CI — Rust CLI tests (format, clippy, test)
  # ==========================================================================
  cli-tests:
    docker:
      - image: cimg/base:current
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_CLI_TESTS=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install Rust
          command: |
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.91.1 -c clippy,rustfmt
            echo 'export PATH="$HOME/.cargo/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Check Cargo.lock
          command: cd cli && cargo update --workspace --locked
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Check formatting
          command: cd cli && cargo fmt --all -- --check
      - run:
          name: Run clippy
          command: cd cli && cargo clippy --all-targets --all-features -- -D warnings
      - run:
          name: Run tests
          command: cd cli && cargo test --all-features
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # DAGSTER CI — Pipeline tests (needs Docker Compose)
  # ==========================================================================
  dagster-tests:
    # migrated to docker.large.gen2 ($0.0144/min)
    docker:
      - image: cimg/python:3.12-node
      - image: postgres:15.12-alpine
        environment:
          POSTGRES_USER: posthog
          POSTGRES_DB: posthog
          POSTGRES_PASSWORD: posthog
        entrypoint: sh
        command:
          - -c
          - |
            mkdir -p /docker-entrypoint-initdb.d
            cat > /docker-entrypoint-initdb.d/00-posthog.sql \<<'EOF'
            CREATE DATABASE test_posthog;
            CREATE DATABASE posthog_persons;
            CREATE DATABASE posthog_persons_e2e_test;
            CREATE DATABASE posthog_e2e_test;
            CREATE DATABASE test_behavioral_cohorts;
            CREATE DATABASE cyclotron;
            CREATE DATABASE cyclotron_node;
            CREATE DATABASE dagster_test;
            CREATE DATABASE temporal;
            CREATE DATABASE temporal_visibility;
            GRANT ALL PRIVILEGES ON DATABASE test_posthog TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE temporal TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO posthog;
            EOF
            exec docker-entrypoint.sh postgres
      - image: redis:7.2-alpine
      - image: clickhouse/clickhouse-server:26.3.9.8
        environment:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
          KAFKA_HOSTS: "localhost:9092"
        entrypoint: sh
        command:
          - -c
          - |
            mkdir -p /etc/clickhouse-server/config.d
            cat > /etc/clickhouse-server/config.d/posthog-cluster.xml \<<'EOF'
            <clickhouse>
              <remote_servers replace="replace">
                <posthog><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog>
                <posthog_single_shard><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_single_shard>
                <posthog_migrations><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_migrations>
                <posthog_writable><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_writable>
                <posthog_primary_replica><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_primary_replica>
                <ai_events><shard><replica><host>localhost</host><port>9000</port></replica></shard></ai_events>
                <aux><shard><replica><host>localhost</host><port>9000</port></replica></shard></aux>
                <ops><shard><replica><host>localhost</host><port>9000</port></replica></shard></ops>
                <sessions><shard><replica><host>localhost</host><port>9000</port></replica></shard></sessions>
              </remote_servers>
              <named_collections>
                <msk_cluster><kafka_broker_list from_env="KAFKA_HOSTS"/></msk_cluster>
                <warpstream_ingestion><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_ingestion>
                <warpstream_calculated_events><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_calculated_events>
                <warpstream_replay><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_replay>
              </named_collections>
              <macros>
                <shard>01</shard>
                <replica>ch1</replica>
                <hostClusterType>online</hostClusterType>
                <hostClusterRole>data</hostClusterRole>
              </macros>
              <uncompressed_cache_size>268435456</uncompressed_cache_size>
              <mark_cache_size>268435456</mark_cache_size>
              <max_server_memory_usage>4294967296</max_server_memory_usage>
              <max_server_memory_usage_to_ram_ratio>0.5</max_server_memory_usage_to_ram_ratio>
              <zookeeper>
                <node><host>localhost</host><port>2181</port></node>
              </zookeeper>
              <distributed_ddl><path>/clickhouse/task_queue/ddl</path></distributed_ddl>
              <!-- Force eager creation of system.query_log, crash_log, etc.
                   PostHog's migrations create materialized views over these system tables,
                   which fail with "Unknown table expression identifier" when CH creates them lazily on first use. -->
              <system_tables_lazy_load>false</system_tables_lazy_load>
              <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
              <crash_log><database>system</database><table>crash_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></crash_log>
              <part_log><database>system</database><table>part_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></part_log>
              <trace_log><database>system</database><table>trace_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></trace_log>
              <metric_log><database>system</database><table>metric_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><collect_interval_milliseconds>1000</collect_interval_milliseconds></metric_log>
              <asynchronous_metric_log><database>system</database><table>asynchronous_metric_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></asynchronous_metric_log>
              <opentelemetry_span_log><database>system</database><table>opentelemetry_span_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><engine>engine MergeTree partition by toYYYYMM(finish_date) order by (finish_date, finish_time_us, trace_id)</engine></opentelemetry_span_log>
              <session_log><database>system</database><table>session_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></session_log>
              <query_views_log><database>system</database><table>query_views_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_views_log>
              <query_thread_log><database>system</database><table>query_thread_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_thread_log>
              <text_log><database>system</database><table>text_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><level>warning</level></text_log>
              <backup_log><database>system</database><table>backup_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></backup_log>
            </clickhouse>
            EOF
            # Map PostHog's compose-era hostnames to localhost so CH can resolve objectstorage
            # (data warehouse tests query S3 URLs that ref the hostname, not 'localhost')
            # host.docker.internal: PostHog's data warehouse tests use this Docker-Desktop magic
            # hostname for S3 endpoints. On Linux Docker / CCI it's not auto-resolved.
            echo "127.0.0.1 objectstorage db redis7 kafka clickhouse clickhouse-coordinator seaweedfs temporal minio host.docker.internal" >> /etc/hosts
            # Enable non-deterministic mutations for ALTER UPDATE/DELETE with dictGet/subquery —
            # PostHog's test_delete_person + test_backfill_*_on_events use these and CH blocks
            # them by default on Replicated tables.
            mkdir -p /etc/clickhouse-server/users.d
            cat > /etc/clickhouse-server/users.d/posthog-overrides.xml \<<'UEOF'
            <clickhouse>
              <profiles>
                <default>
                  <allow_nondeterministic_mutations>1</allow_nondeterministic_mutations>
                  <mutations_sync>1</mutations_sync>
                </default>
              </profiles>
            </clickhouse>
            UEOF
            exec /entrypoint.sh
      - image: zookeeper:3.7.0
      - image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        command:
          - redpanda
          - start
          - --kafka-addr=internal://0.0.0.0:9092
          - --advertise-kafka-addr=internal://localhost:9092
          - --rpc-addr=0.0.0.0:33145
          - --advertise-rpc-addr=localhost:33145
          - --mode=dev-container
          - --smp=1
          - --memory=1G
          - --overprovisioned
          - --set
          - redpanda.empty_seed_starts_cluster=true
      - image: minio/minio:RELEASE.2025-04-22T22-12-26Z
        environment:
          MINIO_ROOT_USER: object_storage_root_user
