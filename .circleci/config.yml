          name: Skipped (sidecars on docker executor handle services)
          command: echo "Services running as docker sidecars; no compose up needed"
      - run:
          name: Install system dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libssl-dev pkg-config unzip clang libclang-dev libxml2-dev libxmlsec1-dev libxmlsec1-openssl postgresql-client || true
            curl -sSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip
            sudo unzip -o /tmp/protoc.zip -d /usr/local
