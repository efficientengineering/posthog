version: 2.1

# 2-stage dynamic config: this setup pipeline runs path-filtering against the diff,
# then continues to continue_config.yml with one parameter per CCI workflow indicating
# whether it should run. Mirrors GHA's `dorny/paths-filter` per-workflow `changes` job pattern.

setup: true

orbs:
    continuation: circleci/continuation@1.0.0

jobs:
    path-filter:
        docker:
            - image: cimg/python:3.12
        resource_class: small
        steps:
            - checkout
            - run:
                  name: Compute changed files vs base ref
                  command: |
                      set -euo pipefail
                      BASE_REF="${CIRCLE_BASE_REVISION:-master}"
                      # On master push, "no skip" — run everything (mirrors GHA's `if: github.event_name != 'push'`)
                      if [ -z "${CIRCLE_PULL_REQUEST:-}" ] && [ "${CIRCLE_BRANCH:-}" = "master" ]; then
                          echo "Master push detected — running full pipeline"
                          git diff --name-only HEAD~1 HEAD > /tmp/changed_files.txt || echo "" > /tmp/changed_files.txt
                          export FORCE_ALL=1
                      else
                          # PR build — diff against the base
                          git fetch --no-tags --prune --depth=1 origin "$BASE_REF" 2>/dev/null || true
                          git diff --name-only "origin/$BASE_REF...HEAD" > /tmp/changed_files.txt 2>/dev/null \
                              || git diff --name-only HEAD~1 HEAD > /tmp/changed_files.txt
                          export FORCE_ALL=0
                      fi
                      echo "=== Changed files ==="
                      cat /tmp/changed_files.txt
                      echo "===================="
                      echo "FORCE_ALL=$FORCE_ALL" > /tmp/filter_env.sh
            - run:
                  name: Compute per-workflow run flags
                  command: |
                      set -euo pipefail
                      source /tmp/filter_env.sh
                      python3 .circleci/path_filter.py /tmp/changed_files.txt "$FORCE_ALL" > /tmp/parameters.json
                      echo "=== Parameters generated ==="
                      cat /tmp/parameters.json
            - continuation/continue:
                  configuration_path: .circleci/continue_config.yml
                  parameters: /tmp/parameters.json

workflows:
    setup:
        jobs:
            - path-filter
