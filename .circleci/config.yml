# PostHog CI — CircleCI Mirror for Benchmarking
# Mirrors ALL PostHog GHA CI workflows (30 workflows, ~48 jobs)
# Clean benchmark run trigger: 2026-05-07
version: 2.1

# ---------------------------------------------------------------------------
# Shared environment variables (match GHA env blocks)
# ---------------------------------------------------------------------------

parameters:
  run-all:
    type: boolean
    default: true

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------

jobs:

  # ==========================================================================
  # SYSBENCH — Synthetic hardware benchmark
  # ==========================================================================
  sysbench:
    # machine: synthetic hardware benchmark, executor choice intentional
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    environment:
      JOB_NAME: sysbench
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_SYSBENCH=$(date +%s%N)"
      - run:
          name: Install sysbench
          command: export DEBIAN_FRONTEND=noninteractive && sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true && sudo -E apt-get install -y sysbench
      - run:
          name: System Info
          command: |
            echo "=== CPU ==="
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|MHz'
            echo "=== Memory ==="
            free -h
            echo "=== Disk ==="
            df -h .
            echo "=== Kernel ==="
            uname -r
      - run:
          name: CPU Benchmark
          command: |
            echo "BENCH_START_CPU=$(date +%s%N)"
            sysbench cpu --cpu-max-prime=20000 --threads=2 --time=30 run
            echo "BENCH_DONE_CPU=$(date +%s%N)"
      - run:
          name: Memory Write Benchmark
          command: |
            echo "BENCH_START_MEM_WRITE=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=write --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_WRITE=$(date +%s%N)"
      - run:
          name: Memory Read Benchmark
          command: |
            echo "BENCH_START_MEM_READ=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=read --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_READ=$(date +%s%N)"
      - run:
          name: File IO Sequential Write
          command: |
            echo "BENCH_START_FILEIO_SEQWR=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqwr --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQWR=$(date +%s%N)"
      - run:
          name: File IO Sequential Read
          command: |
            echo "BENCH_START_FILEIO_SEQRD=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqrd --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQRD=$(date +%s%N)"
      - run:
          name: File IO Random Read/Write
          command: |
            echo "BENCH_START_FILEIO_RNDRW=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=rndrw --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_RNDRW=$(date +%s%N)"
      - run:
          name: Job Done
          command: echo "JOB_DONE_SYSBENCH=$(date +%s%N)"

  # ==========================================================================
  # SYSBENCH (DOCKER) — same suite as sysbench, but on the docker executor
  # at large.gen2 ($0.0144/min). Canary for cost-model migration.
  # ==========================================================================
  sysbench-docker:
    docker:
      - image: cimg/base:current
    resource_class: large.gen2
    environment:
      JOB_NAME: sysbench-docker
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_SYSBENCH_DOCKER=$(date +%s%N)"
      - run:
          name: Install sysbench
          command: export DEBIAN_FRONTEND=noninteractive && sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true && sudo -E apt-get install -y sysbench
      - run:
          name: System Info
          command: |
            echo "RUNNER_LABEL=cci-docker-large-gen2"
            echo "=== CPU ==="
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|MHz' || true
            echo "=== Memory ==="
            free -h
            echo "=== Disk ==="
            df -h .
            echo "=== Kernel ==="
            uname -r
      - run:
          name: CPU Benchmark
          command: |
            echo "BENCH_START_CPU=$(date +%s%N)"
            sysbench cpu --cpu-max-prime=20000 --threads=2 --time=30 run
            echo "BENCH_DONE_CPU=$(date +%s%N)"
      - run:
          name: Memory Write Benchmark
          command: |
            echo "BENCH_START_MEM_WRITE=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=write --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_WRITE=$(date +%s%N)"
      - run:
          name: Memory Read Benchmark
          command: |
            echo "BENCH_START_MEM_READ=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=read --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_READ=$(date +%s%N)"
      - run:
          name: File IO Sequential Write
          command: |
            echo "BENCH_START_FILEIO_SEQWR=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqwr --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQWR=$(date +%s%N)"
      - run:
          name: File IO Sequential Read
          command: |
            echo "BENCH_START_FILEIO_SEQRD=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqrd --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQRD=$(date +%s%N)"
      - run:
          name: File IO Random Read/Write
          command: |
            echo "BENCH_START_FILEIO_RNDRW=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=rndrw --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_RNDRW=$(date +%s%N)"
      - run:
          name: Job Done
          command: echo "JOB_DONE_SYSBENCH_DOCKER=$(date +%s%N)"

  # ==========================================================================
  # PYTHON CI — Ruff, mypy, type checking (no Docker needed)
  # ==========================================================================
  python-code-quality:
    docker:
      - image: cimg/python:3.12
    resource_class: large.gen2
    environment:
      UV_HTTP_TIMEOUT: "120"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_PYTHON_CODE_QUALITY=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.10.2/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install SAML dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl brotli || true
      - restore_cache:
          keys:
            - uv-python-{{ checksum "uv.lock" }}
            - uv-python-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: UV_PROJECT_ENVIRONMENT=$HOME/.pyenv/versions/3.12*/envs/main uv sync --frozen --dev || uv sync --frozen --dev
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - save_cache:
          key: uv-python-{{ checksum "uv.lock" }}
          paths:
            - ~/.cache/uv
      - run:
          name: Download GeoIP database
          command: ./bin/download-mmdb || true
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Ruff check
          command: uv run ruff check .
      - run:
          name: Ruff format check
          command: uv run ruff format --check --diff .
      - run:
          name: Mypy type checking
          command: uv run mypy --cache-fine-grained . || true
      - run:
          name: Run hogli tests
          command: uv run pytest common/hogli/tests/ -v --junitxml=junit-hogli.xml || true
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"
      - store_test_results:
          path: junit-hogli.xml

  # ==========================================================================
  # FRONTEND CI — Lint + Jest (no Docker needed)
  # ==========================================================================
  frontend-format:
    docker:
      - image: cimg/node:lts
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_FRONTEND_FORMAT=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - restore_cache:
          keys:
            - pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-frontend-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: |
            pnpm --filter=@posthog/playwright... install --frozen-lockfile
            bin/turbo --filter=@posthog/frontend prepare
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - save_cache:
          key: pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - node_modules
            - ~/.local/share/pnpm/store
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Lint with Oxlint
          command: pnpm exec oxlint --quiet
      - run:
          name: Lint CSS with Stylelint
          command: pnpm run lint:css
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  frontend-typescript:
    docker:
      - image: cimg/node:lts
    resource_class: large.gen2
    environment:
      NODE_OPTIONS: "--max-old-space-size=16384"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_FRONTEND_TYPESCRIPT=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - restore_cache:
          keys:
            - pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-frontend-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: |
            pnpm --filter=@posthog/playwright... install --no-frozen-lockfile
            bin/turbo --filter=@posthog/frontend prepare
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Build products
          command: pnpm --filter=@posthog/frontend build:products
      - run:
          name: TypeScript strict check
          command: pnpm --filter=@posthog/frontend typescript:check
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  jest:
    parameters:
      segment:
        type: string
      chunk:
        type: integer
    docker:
      - image: cimg/node:lts
    resource_class: large.gen2
    environment:
      NODE_OPTIONS: "--max-old-space-size=16384"
      SHARD_INDEX: << parameters.chunk >>
      SHARD_COUNT: "2"
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_JEST_<< parameters.segment >>_<< parameters.chunk >>=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Remove ee (FOSS only)
          command: |
            if [ "<< parameters.segment >>" = "FOSS" ]; then rm -rf ee; fi
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - restore_cache:
          keys:
            - pnpm-frontend-{{ checksum "pnpm-lock.yaml" }}
            - pnpm-frontend-
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install dependencies
          command: pnpm --filter=@posthog/frontend... install --frozen-lockfile
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run Jest tests
          command: bin/turbo run test --filter=@posthog/frontend -- --maxWorkers=2
          no_output_timeout: 15m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # HOG CI — HogVM/HogQL tests (no Docker needed)
  # ==========================================================================
  hog-tests:
    docker:
      - image: cimg/python:3.12-node
    resource_class: large.gen2
    steps:
      - run:
          name: Job Start
          command: echo "JOB_START_HOG_TESTS=$(date +%s%N)"
      - checkout
      - run:
          name: Checkout Done
          command: echo "STEP_DONE_CHECKOUT=$(date +%s%N)"
      - run:
          name: Install uv
          command: |
            curl -LsSf https://astral.sh/uv/0.10.2/install.sh | sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install SAML dependencies
          no_output_timeout: 15m
          command: |
            export DEBIAN_FRONTEND=noninteractive
            sudo -E apt-get update -q -o Acquire::Retries=3 -o Acquire::http::Timeout=30 || true
            sudo -E apt-get install -y --no-install-recommends -o Acquire::Retries=3 libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl brotli || true
      - run:
          name: Start Install
          command: echo "STEP_START_INSTALL=$(date +%s%N)"
      - run:
          name: Install Python dependencies
          command: uv sync --frozen --dev || true
      - run:
          name: Install pnpm
          command: sudo npm install -g pnpm || corepack enable
      - run:
          name: Install Done
          command: echo "STEP_DONE_INSTALL=$(date +%s%N)"
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run HogVM Python tests
          command: uv run pytest common/hogvm || true
      - run:
          name: Install HogVM JS deps
          command: pnpm --filter=@posthog/hogvm install --frozen-lockfile
      - run:
          name: Run HogVM TypeScript tests
          command: pnpm --filter=@posthog/hogvm test || true
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

  # ==========================================================================
  # BACKEND CI — Django tests (needs Docker Compose for services)
  # Full matrix: 38 Core + 7 Core-POE + 7 Temporal = 52 shards
  # ==========================================================================
  django-tests:
    parameters:
      group:
        type: integer
      concurrency:
        type: integer
        default: 38
      segment:
        type: string
        default: "Core"
      person-on-events:
        type: boolean
        default: false
    # migrated to docker.large.gen2 ($0.0144/min)
    docker:
      - image: cimg/python:3.12-node
      - image: postgres:15.12-alpine
        environment:
          POSTGRES_USER: posthog
          POSTGRES_DB: posthog
          POSTGRES_PASSWORD: posthog
        entrypoint: sh
        command:
          - -c
          - |
            mkdir -p /docker-entrypoint-initdb.d
            cat > /docker-entrypoint-initdb.d/00-posthog.sql \<<'EOF'
            CREATE DATABASE test_posthog;
            CREATE DATABASE posthog_persons;
            CREATE DATABASE posthog_persons_e2e_test;
            CREATE DATABASE posthog_e2e_test;
            CREATE DATABASE test_behavioral_cohorts;
            CREATE DATABASE cyclotron;
            CREATE DATABASE cyclotron_node;
            CREATE DATABASE dagster_test;
            CREATE DATABASE temporal;
            CREATE DATABASE temporal_visibility;
            GRANT ALL PRIVILEGES ON DATABASE test_posthog TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE temporal TO posthog;
            GRANT ALL PRIVILEGES ON DATABASE temporal_visibility TO posthog;
            EOF
            exec docker-entrypoint.sh postgres
      - image: redis:7.2-alpine
      - image: clickhouse/clickhouse-server:26.3.9.8
        environment:
          CLICKHOUSE_SKIP_USER_SETUP: "1"
          KAFKA_HOSTS: "localhost:9092"
        entrypoint: sh
        command:
          - -c
          - |
            mkdir -p /etc/clickhouse-server/config.d
            cat > /etc/clickhouse-server/config.d/posthog-cluster.xml \<<'EOF'
            <clickhouse>
              <remote_servers replace="replace">
                <posthog><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog>
                <posthog_single_shard><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_single_shard>
                <posthog_migrations><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_migrations>
                <posthog_writable><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_writable>
                <posthog_primary_replica><shard><replica><host>localhost</host><port>9000</port></replica></shard></posthog_primary_replica>
                <ai_events><shard><replica><host>localhost</host><port>9000</port></replica></shard></ai_events>
                <aux><shard><replica><host>localhost</host><port>9000</port></replica></shard></aux>
                <ops><shard><replica><host>localhost</host><port>9000</port></replica></shard></ops>
                <sessions><shard><replica><host>localhost</host><port>9000</port></replica></shard></sessions>
              </remote_servers>
              <named_collections>
                <msk_cluster><kafka_broker_list from_env="KAFKA_HOSTS"/></msk_cluster>
                <warpstream_ingestion><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_ingestion>
                <warpstream_calculated_events><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_calculated_events>
                <warpstream_replay><kafka_broker_list from_env="KAFKA_HOSTS"/></warpstream_replay>
              </named_collections>
              <macros>
                <shard>01</shard>
                <replica>ch1</replica>
                <hostClusterType>online</hostClusterType>
                <hostClusterRole>data</hostClusterRole>
              </macros>
              <uncompressed_cache_size>268435456</uncompressed_cache_size>
              <mark_cache_size>268435456</mark_cache_size>
              <max_server_memory_usage>4294967296</max_server_memory_usage>
              <max_server_memory_usage_to_ram_ratio>0.5</max_server_memory_usage_to_ram_ratio>
              <zookeeper>
                <node><host>localhost</host><port>2181</port></node>
              </zookeeper>
              <distributed_ddl><path>/clickhouse/task_queue/ddl</path></distributed_ddl>
              <!-- Force eager creation of system.query_log, crash_log, etc.
                   PostHog's migrations create materialized views over these system tables,
                   which fail with "Unknown table expression identifier" when CH creates them lazily on first use. -->
              <system_tables_lazy_load>false</system_tables_lazy_load>
              <query_log><database>system</database><table>query_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_log>
              <crash_log><database>system</database><table>crash_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></crash_log>
              <part_log><database>system</database><table>part_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></part_log>
              <trace_log><database>system</database><table>trace_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></trace_log>
              <metric_log><database>system</database><table>metric_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><collect_interval_milliseconds>1000</collect_interval_milliseconds></metric_log>
              <asynchronous_metric_log><database>system</database><table>asynchronous_metric_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></asynchronous_metric_log>
              <opentelemetry_span_log><database>system</database><table>opentelemetry_span_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><engine>engine MergeTree partition by toYYYYMM(finish_date) order by (finish_date, finish_time_us, trace_id)</engine></opentelemetry_span_log>
              <session_log><database>system</database><table>session_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></session_log>
              <query_views_log><database>system</database><table>query_views_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_views_log>
              <query_thread_log><database>system</database><table>query_thread_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></query_thread_log>
              <text_log><database>system</database><table>text_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds><level>warning</level></text_log>
              <backup_log><database>system</database><table>backup_log</table><flush_interval_milliseconds>1000</flush_interval_milliseconds></backup_log>
            </clickhouse>
            EOF
            # Map PostHog's compose-era hostnames to localhost so CH can resolve objectstorage
            # (data warehouse tests query S3 URLs that ref the hostname, not 'localhost')
            # host.docker.internal: PostHog's data warehouse tests use this Docker-Desktop magic
            # hostname for S3 endpoints. On Linux Docker / CCI it's not auto-resolved.
            echo "127.0.0.1 objectstorage db redis7 kafka clickhouse clickhouse-coordinator seaweedfs temporal minio host.docker.internal" >> /etc/hosts
            # Enable non-deterministic mutations for ALTER UPDATE/DELETE with dictGet/subquery —
            # PostHog's test_delete_person + test_backfill_*_on_events use these and CH blocks
            # them by default on Replicated tables.
            mkdir -p /etc/clickhouse-server/users.d
            cat > /etc/clickhouse-server/users.d/posthog-overrides.xml \<<'UEOF'
            <clickhouse>
              <profiles>
                <default>
                  <allow_nondeterministic_mutations>1</allow_nondeterministic_mutations>
                  <mutations_sync>1</mutations_sync>
                </default>
              </profiles>
            </clickhouse>
            UEOF
            exec /entrypoint.sh
      - image: zookeeper:3.7.0
      - image: docker.redpanda.com/redpandadata/redpanda:v25.1.9
        command:
          - redpanda
          - start
          - --kafka-addr=internal://0.0.0.0:9092
          - --advertise-kafka-addr=internal://localhost:9092
          - --rpc-addr=0.0.0.0:33145
          - --advertise-rpc-addr=localhost:33145
          - --mode=dev-container
          - --smp=1
          - --memory=1G
