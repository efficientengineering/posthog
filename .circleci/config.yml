            # Pre-create system.crash_log + trigger lazy creation of other system log tables.
            # PostHog's migrations create MVs over these system tables, but CH creates them
            # lazily on first use. Dagster (and any job hitting migrate_clickhouse early) fails
            # with "Unknown table expression identifier 'system.crash_log'" without this.
            try:
                ddl = ("CREATE TABLE IF NOT EXISTS system.crash_log ("
                       "hostname LowCardinality(String), event_date Date, event_time DateTime, "
                       "timestamp_ns UInt64, signal Int32, thread_id UInt64, query_id String, "
                       "trace Array(UInt64), trace_full Array(String), version String, "
                       "revision UInt32, build_id String DEFAULT '') "
                       "ENGINE = MergeTree ORDER BY event_time")
                urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=ddl.encode(), method='POST'), timeout=10).read()
                for q in ['SELECT 1', 'SYSTEM FLUSH LOGS']:
                    try:
                        urllib.request.urlopen(urllib.request.Request('http://localhost:8123/', data=q.encode(), method='POST'), timeout=10).read()
                    except: pass
                print('Pre-created system.crash_log + flushed lazy logs')
            except Exception as e:
                print(f'WARN: system table init: {e}', file=sys.stderr)
            print(f'UDFs: {pushed} pushed, {skipped} skipped')
            PYEOF
      - run:
          name: Run migrations and seed data
          command: |
            uv run python manage.py migrate --noinput
            uv run python manage.py migrate_clickhouse
            uv run python manage.py generate_demo_data --n-clusters 10 --days-past 7 --days-future 0 --skip-materialization --skip-flag-sync --skip-user-product-list || true
      - run:
          name: Smoke-test PostHog imports (catch ImportError before granian backgrounds it)
          command: |
            uv run python -c "import posthog.asgi; print('posthog.asgi import OK')" \
              || (echo "FATAL: posthog.asgi failed to import — see traceback above"; exit 1)
      - run:
          name: Start PostHog web only (background, no celery — match e2e-playwright's working pattern)
          no_output_timeout: 3m
          command: |
            # Pipeline #81 finding: uvicorn alone (without celery) STILL gets cgroup-OOM-killed
            # at ~10min mark. e2e-playwright uses granian with --workers 1 and works fine on
            # the same 8GB tier. Switching to granian to match the working pattern.
            uv run python -m granian --interface asgi posthog.asgi:application --host 0.0.0.0 --port 8000 --workers 1 --log-level info &> /tmp/server.log &
            SERVER_PID=$!
            sleep 10
            echo "=== After 10s: server_pid=$SERVER_PID($(ps -p $SERVER_PID -o stat= 2>/dev/null || echo DEAD)) ==="
            echo "=== /tmp/server.log (first 100 lines) ==="
            head -100 /tmp/server.log 2>&1 || echo "(empty)"
            echo "=== process tree ==="
            pstree -p $SERVER_PID 2>/dev/null || ps -ef | grep -E "granian|python" | head -10
            echo "=== free memory ==="
            free -m
      - run:
          name: Wait for PostHog
          no_output_timeout: 15m   # CCI default is 10m; we wait up to 10m here so headroom is needed
          command: |
            # Progress-printing wait loop so CCI's no_output_timeout doesn't kick in
            READY=0
            for i in $(seq 1 120); do
              if curl -sf http://localhost:8000 >/dev/null 2>&1; then
                echo "PostHog ready after ${i}x5s"
                READY=1
                break
              fi
              [ $((i % 6)) -eq 0 ] && echo "Still waiting for PostHog (${i}x5s elapsed)..."
              sleep 5
            done
            if [ "$READY" = "1" ]; then exit 0; fi
            # READY=0 below: dump diagnostics and exit 1
            if true; then
              echo "=== PostHog server failed to start within 600s; full log dump ==="
              echo "--- /tmp/server.log (full) ---"
              cat /tmp/server.log 2>/dev/null || echo "(no server log file)"
              echo "--- ps aux (all python/uvicorn) ---"
              ps aux | grep -E "python|uvicorn" | head -20
              echo "--- listening ports ---"
              ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null || true
              echo "--- memory ---"
              free -m
              exit 1
            fi
      - run:
          name: Start Test
          command: echo "STEP_START_TEST=$(date +%s%N)"
      - run:
          name: Run MCP integration tests
          command: cd services/mcp && pnpm run test:integration || true
          no_output_timeout: 30m
      - run:
          name: Test Done
          command: echo "STEP_DONE_TEST=$(date +%s%N)"

