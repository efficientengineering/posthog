# CircleCI sysbench sweep across resource classes.
# Drop into .circleci/config.yml on a `benchmark/sysbench-sweep` branch of
# `efficientengineering/posthog`. Pairs with `ci-sysbench-sweep.yml` on the
# GHA side — commands are byte-for-byte identical so results compare 1:1.
#
# Sweeps the machine executor lineup (Gen1 + Gen2) at the sizes that bracket
# what PostHog actually uses today (large.gen2 default, xlarge.gen2 for
# e2e-playwright). We include `medium` and `2xlarge.gen2` to characterize
# the rest of the price/performance curve.
#
# We intentionally do NOT use the docker executor here — the real PostHog
# CCI mirror runs on `machine` because llm/ollama-style jobs need
# Docker-in-Docker, and we want sysbench numbers that reflect the same
# substrate the real workload uses.

version: 2.1

# ---------------------------------------------------------------------------
# Reusable command: full sysbench suite. Identical to the GHA composite
# action `actions/sysbench-run/action.yml`.
# ---------------------------------------------------------------------------
commands:
  run-sysbench-suite:
    parameters:
      runner_label:
        type: string
        description: Free-form label echoed into the log so the parser knows which runner produced this output
    steps:
      - run:
          name: Job Start
          command: |
            echo "JOB_START_SYSBENCH=$(date +%s%N)"
            echo "RUNNER_LABEL=<< parameters.runner_label >>"
      - run:
          name: Install sysbench
          command: sudo apt-get update && sudo apt-get install -y sysbench
      - run:
          name: System Info
          command: |
            echo "=== CPU ==="
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Core|Socket|MHz' || true
            echo "=== Memory ==="
            free -h
            echo "=== Disk ==="
            df -h .
            echo "=== Kernel ==="
            uname -r
            echo "=== Cloud metadata (best-effort) ==="
            curl -s --max-time 1 http://169.254.169.254/latest/meta-data/instance-type 2>/dev/null && echo || true
            cat /sys/class/dmi/id/product_name 2>/dev/null || true
            cat /sys/class/dmi/id/sys_vendor 2>/dev/null || true
      - run:
          name: CPU Benchmark
          command: |
            echo "BENCH_START_CPU=$(date +%s%N)"
            sysbench cpu --cpu-max-prime=20000 --threads=2 --time=30 run
            echo "BENCH_DONE_CPU=$(date +%s%N)"
      - run:
          name: Memory Write Benchmark
          command: |
            echo "BENCH_START_MEM_WRITE=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=write --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_WRITE=$(date +%s%N)"
      - run:
          name: Memory Read Benchmark
          command: |
            echo "BENCH_START_MEM_READ=$(date +%s%N)"
            sysbench memory --memory-block-size=1K --memory-total-size=10G --memory-oper=read --threads=2 --time=30 run
            echo "BENCH_DONE_MEM_READ=$(date +%s%N)"
      - run:
          name: File IO Sequential Write
          command: |
            echo "BENCH_START_FILEIO_SEQWR=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqwr --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQWR=$(date +%s%N)"
      - run:
          name: File IO Sequential Read
          command: |
            echo "BENCH_START_FILEIO_SEQRD=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=seqrd --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_SEQRD=$(date +%s%N)"
      - run:
          name: File IO Random Read/Write
          command: |
            echo "BENCH_START_FILEIO_RNDRW=$(date +%s%N)"
            sysbench fileio --file-total-size=1G --file-num=4 prepare
            sysbench fileio --file-total-size=1G --file-num=4 --file-test-mode=rndrw --threads=2 --time=30 run
            sysbench fileio --file-total-size=1G --file-num=4 cleanup
            echo "BENCH_DONE_FILEIO_RNDRW=$(date +%s%N)"
      - run:
          name: Job Done
          command: echo "JOB_DONE_SYSBENCH=$(date +%s%N)"

# ---------------------------------------------------------------------------
# One job per resource class. Keep image fixed (ubuntu-2204:current) so
# the only variable across jobs is the resource class itself.
# ---------------------------------------------------------------------------
jobs:
  sysbench-medium:
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    steps:
      - run-sysbench-suite:
          runner_label: cci-machine-medium

  sysbench-large:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - run-sysbench-suite:
          runner_label: cci-machine-large

  sysbench-large-gen2:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - run-sysbench-suite:
          runner_label: cci-machine-large.gen2

  sysbench-xlarge:
    machine:
      image: ubuntu-2204:current
    resource_class: xlarge
    steps:
      - run-sysbench-suite:
          runner_label: cci-machine-xlarge

  sysbench-xlarge-gen2:
    machine:
      image: ubuntu-2204:current
    resource_class: xlarge.gen2
    steps:
      - run-sysbench-suite:
          runner_label: cci-machine-xlarge.gen2

  sysbench-2xlarge-gen2:
    machine:
      image: ubuntu-2204:current
    resource_class: 2xlarge.gen2
    steps:
      - run-sysbench-suite:
          runner_label: cci-machine-2xlarge.gen2

workflows:
  sysbench-sweep:
    jobs:
      - sysbench-medium
      - sysbench-large
      - sysbench-large-gen2
      - sysbench-xlarge
      - sysbench-xlarge-gen2
      - sysbench-2xlarge-gen2
